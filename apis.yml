name: Spacee
description: >-
  Spacee Inc. (株式会社スペイシー) is a Tokyo-based space-sharing and rental marketplace
  operator in Japan. Its consumer platforms let people discover and book temporary
  spaces by the hour: Yoyappin, a booking marketplace for meeting rooms, conference
  rooms, studios, kitchens and event venues across the Tokyo metropolitan area; THE
  POINT, a premium coworking and creative "third place" for remote workers; and
  Office Connect, a nationwide search service for shared offices, rental offices,
  coworking spaces and virtual offices. Spacee also expands via partnerships (e.g.
  JR West Japan) and acquisitions (GYYM pay-per-use fitness). It operates as a
  consumer web and mobile marketplace and does not publish a public developer API,
  SDKs, or API documentation.
